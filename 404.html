<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KorA Valley</title>
  <script>
    // GitHub Pages SPA 리디렉션 트릭
    // 원래 URL을 sessionStorage에 저장한 뒤 루트로 이동
    var path = window.location.pathname + window.location.search + window.location.hash;
    sessionStorage.setItem('spa-redirect', path);
    window.location.replace('/');
  </script>
</head>
<body></body>
</html>
